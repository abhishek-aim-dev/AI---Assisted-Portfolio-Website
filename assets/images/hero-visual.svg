<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Purple Radial Glow Backdrop -->
    <radialGradient id="heroAura" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#7657ff" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#4f46e5" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#070c18" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="laptopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7657ff"/>
    </linearGradient>
    <filter id="heroGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Big Glowing Circle Backdrop -->
  <circle cx="310" cy="270" r="230" fill="url(#heroAura)"/>

  <!-- Decorative Orbit Rings -->
  <circle cx="310" cy="270" r="255" fill="none" stroke="#7657ff" stroke-width="1" stroke-dasharray="6 8" opacity="0.35"/>
  <circle cx="310" cy="270" r="210" fill="none" stroke="#a78bfa" stroke-width="0.8" opacity="0.25"/>

  <!-- Floating Tech Chips / Constellations -->
  <g transform="translate(110, 140)">
    <circle cx="0" cy="0" r="18" fill="#1e1b4b" stroke="#7657ff" stroke-width="1"/>
    <text x="0" y="5" fill="#a78bfa" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">&lt;/&gt;</text>
  </g>
  <g transform="translate(480, 100)">
    <circle cx="0" cy="0" r="16" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1"/>
    <text x="0" y="5" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">JS</text>
  </g>
  <g transform="translate(510, 360)">
    <circle cx="0" cy="0" r="16" fill="#1e1b4b" stroke="#fbbf24" stroke-width="1"/>
    <text x="0" y="5" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Py</text>
  </g>
  <g transform="translate(80, 380)">
    <circle cx="0" cy="0" r="16" fill="#1e1b4b" stroke="#f43f5e" stroke-width="1"/>
    <text x="0" y="5" fill="#f43f5e" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">C++</text>
  </g>

  <!-- Abstract Modern Developer Silhouette & Tech Desk -->
  <!-- Chair / Backing -->
  <ellipse cx="310" cy="400" rx="90" ry="24" fill="#0f172a" opacity="0.8"/>
  
  <!-- Developer Body (Stylized Geometric Dark Hoodie) -->
  <path d="M210 540 C210 420 250 370 310 370 C370 370 410 420 410 540 Z" fill="#111827" stroke="#374151" stroke-width="1.5"/>
  <!-- Hoodie Collar -->
  <path d="M270 372 C285 410 335 410 350 372 C330 384 290 384 270 372 Z" fill="#1f2937"/>
  <!-- Head & Hair -->
  <circle cx="310" cy="300" r="44" fill="#1e293b"/>
  <path d="M266 295 C266 250 354 250 354 295 C340 270 280 270 266 295 Z" fill="#0f172a"/>
  <!-- Developer Glasses (Cyan/Violet Neon Tint) -->
  <rect x="286" y="292" width="20" height="12" rx="3" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <rect x="314" y="292" width="20" height="12" rx="3" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <line x1="306" y1="298" x2="314" y2="298" stroke="#38bdf8" stroke-width="2"/>

  <!-- Modern Sleek Laptop -->
  <polygon points="230,470 390,470 370,410 250,410" fill="url(#laptopGrad)" stroke="#475569" stroke-width="1.2"/>
  <rect x="258" y="416" width="104" height="48" rx="2" fill="#0284c7" fill-opacity="0.25"/>
  <!-- Glowing Apple/Code icon on laptop back -->
  <text x="310" y="445" fill="#38bdf8" font-family="'Courier New', monospace" font-size="14" font-weight="700" text-anchor="middle">&lt;/&gt;</text>
  <!-- Laptop Base -->
  <polygon points="200,480 420,480 400,470 220,470" fill="#0f172a" stroke="#64748b" stroke-width="1"/>

  <!-- Right Floating Code Card (Matching Reference Screenshot!) -->
  <g transform="translate(350, 110)">
    <rect x="0" y="0" width="230" height="175" rx="12" fill="url(#codeGrad)" stroke="url(#glowBorder)" stroke-width="1.5" filter="url(#heroGlow)"/>
    <rect x="0" y="0" width="230" height="28" rx="12" fill="#1e1b4b" opacity="0.8"/>
    <!-- Dots -->
    <circle cx="16" cy="14" r="4" fill="#ef4444"/>
    <circle cx="28" cy="14" r="4" fill="#f59e0b"/>
    <circle cx="40" cy="14" r="4" fill="#10b981"/>
    <text x="130" y="18" fill="#c4b5fd" font-family="'Courier New', monospace" font-size="10.5" font-weight="700">&lt;/&gt; Code</text>

    <!-- Code Syntax Highlighting -->
    <text x="14" y="48" fill="#f43f5e" font-family="'Courier New', monospace" font-size="10">const</text>
    <text x="50" y="48" fill="#38bdf8" font-family="'Courier New', monospace" font-size="10">developer</text>
    <text x="114" y="48" fill="#cbd5e1" font-family="'Courier New', monospace" font-size="10">= {</text>

    <text x="24" y="66" fill="#e2e8f0" font-family="'Courier New', monospace" font-size="9.5">name:</text>
    <text x="64" y="66" fill="#34d399" font-family="'Courier New', monospace" font-size="9.5">"Abhishek",</text>

    <text x="24" y="84" fill="#e2e8f0" font-family="'Courier New', monospace" font-size="9.5">degree:</text>
    <text x="76" y="84" fill="#34d399" font-family="'Courier New', monospace" font-size="9.5">"B.Tech CSE",</text>

    <text x="24" y="102" fill="#e2e8f0" font-family="'Courier New', monospace" font-size="9.5">skills:</text>
    <text x="70" y="102" fill="#fbbf24" font-family="'Courier New', monospace" font-size="9.5">["HTML", "CSS",</text>
    <text x="70" y="118" fill="#fbbf24" font-family="'Courier New', monospace" font-size="9.5"> "JS", "Python"],</text>

    <text x="24" y="136" fill="#e2e8f0" font-family="'Courier New', monospace" font-size="9.5">passion:</text>
    <text x="76" y="136" fill="#34d399" font-family="'Courier New', monospace" font-size="9.5">"Web Solutions"</text>

    <text x="14" y="156" fill="#cbd5e1" font-family="'Courier New', monospace" font-size="10">};</text>
  </g>
</svg>
